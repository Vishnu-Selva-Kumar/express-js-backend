services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node-express-app
    restart: unless-stopped
    command: npm run dev
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      TZ: ${TZ:-${APP_TIMEZONE:-UTC}}
      APP_PORT: ${APP_PORT:-3000}
      APP_URL: ${APP_URL:-http://localhost:3000}

      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: express_js
      DB_USERNAME: express_js
      DB_PASSWORD: password

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - .:/app
      - /app/node_modules

  mysql:
    image: mysql:8.4
    container_name: node-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: express_js
      MYSQL_USER: express_js
      MYSQL_PASSWORD: password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password" ]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: node-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      - "8800:80"

    depends_on:
      mysql:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: node-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: ""

volumes:
  mysql_data:
